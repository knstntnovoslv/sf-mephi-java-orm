databaseChangeLog:
  - changeSet:
      id: answer_options-create
      author: ggermashev
      changes:
        - createTable:
            tableName: answer_options
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: is_correct
                  type: boolean
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: question_id
                  type: UUID
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: answer_options

